name: Release BAMP (Windows .exe & Linux .AppImage)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v prefix, e.g. 0.1.1)'
        required: false
        default: '0.1.1'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (.AppImage & .deb)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri AppImage & deb
        run: |
          pnpm tauri build --bundles appimage,deb

      - name: Collect Linux artifacts
        run: |
          mkdir -p artifacts-linux
          # Copy .AppImage and .deb
          find src-tauri/target/release/bundle/ -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec cp {} artifacts-linux/ \; 2>/dev/null || true
          # Also copy standalone binary
          if [ -f src-tauri/target/release/bamp ]; then
            cp src-tauri/target/release/bamp artifacts-linux/bamp-linux-x86_64
          fi
          ls -lah artifacts-linux/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bamp-linux
          path: artifacts-linux/*
          if-no-files-found: error

  build-windows:
    name: Build Windows (.exe & .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Pre-bundle Windows Service Binaries
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/install-binaries-win.ps1

      - name: Build Tauri Windows installer (.exe & .msi)
        run: |
          pnpm tauri build --bundles nsis,msi

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts-windows -Force | Out-Null
          # Copy NSIS .exe installers and MSI packages
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include "*.exe", "*.msi" |
            Copy-Item -Destination artifacts-windows/ -Force
          
          # Also copy standalone bamp.exe
          if (Test-Path "src-tauri/target/release/bamp.exe") {
            Copy-Item "src-tauri/target/release/bamp.exe" "artifacts-windows/bamp-windows-x86_64.exe" -Force
          }

          # Create standalone portable zip package with binaries pre-bundled
          $portableDir = "bamp-portable"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          if (Test-Path "src-tauri/target/release/bamp.exe") {
            Copy-Item "src-tauri/target/release/bamp.exe" "$portableDir/bamp.exe" -Force
          }
          if (Test-Path "bin") { Copy-Item "bin" "$portableDir/bin" -Recurse -Force }
          if (Test-Path "templates") { Copy-Item "templates" "$portableDir/templates" -Recurse -Force }
          if (Test-Path "scripts") { Copy-Item "scripts" "$portableDir/scripts" -Recurse -Force }
          if (Test-Path "data/adminer") {
            New-Item -ItemType Directory -Path "$portableDir/data" -Force | Out-Null
            Copy-Item "data/adminer" "$portableDir/data/adminer" -Recurse -Force
          }
          Compress-Archive -Path "$portableDir/*" -DestinationPath "artifacts-windows/bamp-windows-x86_64-portable.zip" -Force

          Get-ChildItem -Path artifacts-windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bamp-windows
          path: artifacts-windows/*
          if-no-files-found: error

  publish-release:
    name: Publish to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          ls -lah
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version || '0.1.0') }}
          name: BAMP Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version || '0.1.0') }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## BAMP: Ultra-Lightweight Modern Local Development Stack Manager

            ### 📦 Download Packages
            - **Windows (Installer)**: Download `bamp_*_x64-setup.exe` (Pre-bundled with Nginx, Apache, PHP 8.3, MariaDB, and Mailpit).
            - **Windows (Portable Zip)**: Download `bamp-windows-x86_64-portable.zip` (Ready to extract and run without installation).
            - **Windows (MSI)**: Download `bamp_*_x64_en-US.msi`.
            - **Linux**: Download `.AppImage` (make executable with `chmod +x`) or `.deb`.

            ### 🛡️ Checksums
            See `SHA256SUMS.txt` attached below for package verification.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
